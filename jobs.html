<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Jobs - Government Jobs Portal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo" onclick="window.location.href='index.html'">
                    <i class="fas fa-landmark"></i>
                    <span>GovJobs Portal</span>
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="jobs.html" class="active">All Jobs</a></li>
                    <li><a href="categories.html">Categories</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
                <div class="nav-actions">
                    <button class="btn btn-outline">Login</button>
                    <button class="btn btn-primary">Register</button>
                </div>
            </nav>
        </div>
    </header>

    <section class="page-header">
        <div class="container">
            <h1>All Government Jobs</h1>
            <p>Browse through all available government job opportunities</p>
        </div>
    </section>

    <section class="jobs-page">
        <div class="container">
            <div class="jobs-layout">
                <aside class="jobs-sidebar">
                    <div class="filter-section">
                        <h3>Filter Jobs</h3>
                        <div class="filter-group">
                            <h4>Category</h4>
                            <label><input type="checkbox" value="banking"> Banking</label>
                            <label><input type="checkbox" value="railway"> Railway</label>
                            <label><input type="checkbox" value="defence"> Defence</label>
                            <label><input type="checkbox" value="teaching"> Teaching</label>
                            <label><input type="checkbox" value="police"> Police</label>
                        </div>
                        <div class="filter-group">
                            <h4>Education</h4>
                            <label><input type="checkbox" value="10th"> 10th Pass</label>
                            <label><input type="checkbox" value="12th"> 12th Pass</label>
                            <label><input type="checkbox" value="graduate"> Graduate</label>
                            <label><input type="checkbox" value="postgraduate"> Post Graduate</label>
                        </div>
                    </div>
                </aside>
                <div class="jobs-main">
                    <div class="jobs-header">
                        <h2>Showing 10 Jobs</h2>
                        <select class="sort-select">
                            <option>Sort by: Latest</option>
                            <option>Sort by: Deadline</option>
                            <option>Sort by: Vacancies</option>
                        </select>
                    </div>
                    <div id="allJobsList" class="jobs-list">
                        <!-- Jobs will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 GovJobs Portal. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadAllJobs();
        });

        function loadAllJobs() {
            const container = document.getElementById('allJobsList');
            const jobs = jobsData;
            
            container.innerHTML = jobs.map(job => createJobListItem(job)).join('');
        }
    </script>
</body>
</html>
